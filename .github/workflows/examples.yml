name: Examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fair-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - elixir: '1.18.4'
            otp: '27.3'
          - elixir: '1.20.4'
            otp: '29.1.2'
    defaults:
      run:
        working-directory: examples/fair_transfer
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors --no-color
